<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adventný kalendár - Indície</title>
    <style>
        :root {
            --bg-color: #0f2027;
            --card-bg: rgba(255, 255, 255, 0.08);
            --accent: #d4af37; /* Zlatá */
            --text-color: #f4f4f4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        h1 {
            color: var(--accent);
            font-size: 1.8rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #ccc;
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        #result {
            margin-top: 25px;
            min-height: 20px;
            transition: all 0.3s ease;
        }

        /* Štýl pre zobrazenú indíciu */
        .clue-box {
            background: rgba(0, 0, 0, 0.3);
            border-left: 4px solid var(--accent);
            padding: 20px;
            border-radius: 8px;
            animation: fadeIn 0.4s ease-out;
            line-height: 1.6;
        }

        .clue-box img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎄 Adventný kalendár</h1>
        <p class="subtitle">Zadaj tajné heslo alebo kód pre odhalenie indície na ďalší deň</p>
        
        <input type="text" id="codeInput" placeholder="Sem napíš heslo..." autocomplete="off">
        
        <!-- Sem sa vloží HTML z JS súboru -->
        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
