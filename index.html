<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adventný kalendár</title>
    <style>
        :root {
            --bg-color: #f7f6f2;       /* Teplá krémová / papierová */
            --card-bg: #ffffff;        /* Čistá biela karta */
            --text-main: #1c1c1c;      /* Tmavosivá takmer čierna */
            --text-muted: #6e6d68;     /* Tlmená sivá */
            --accent: #2d4739;         /* Tlmená jedľová zelená */
            --border-color: #e4e2dc;   /* Jemná linka */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            line-height: 1.6;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 48px 36px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-weight: normal;
            font-size: 1.75rem;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: -0.01em;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-main);
            text-align: center;
            outline: none;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        input[type="text"]:focus {
            background: #ffffff;
            border-color: var(--accent);
        }

        input[type="text"]::placeholder {
            color: #a3a19b;
        }

        #result {
            margin-top: 28px;
        }

        /* Štýl pre zobrazenú indíciu */
        .clue-box {
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            animation: fadeIn 0.3s ease-out;
            text-align: left;
        }

        .clue-box h3 {
            font-family: Georgia, "Times New Roman", serif;
            font-weight: normal;
            font-size: 1.25rem;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .clue-box p {
            font-size: 0.95rem;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .clue-box p:last-child {
            margin-bottom: 0;
        }

        .clue-box img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 16px;
            border: 1px solid var(--border-color);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Adventný kalendár</h1>
            <p class="subtitle">Zadaj heslo pre zobrazenie dnešnej indície</p>
        </header>
        
        <input type="text" id="codeInput" placeholder="Napíš heslo..." autocomplete="off">
        
        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
